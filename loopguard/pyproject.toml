[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopguard"
version = "0.1.0"
description = "A local semantic circuit breaker for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "keyring>=25",
    "numpy>=1.24",
    "pydantic>=2",
    "rapidfuzz>=3",
    "rich>=13",
    "scikit-learn>=1.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
cerebras = ["cerebras_cloud_sdk>=1.0"]
litellm = ["litellm>=1.40"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
loopguard = "loopguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopguard = ["demo_projects/**/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
