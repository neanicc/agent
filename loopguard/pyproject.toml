[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopguard"
version = "0.1.0"
description = "A local semantic circuit breaker for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2",
    "rapidfuzz>=3",
    "rich>=13",
    "scikit-learn>=1.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5"]
control = [
    "cryptography>=42",
    "keyring>=25",
    "pywin32>=306; sys_platform == 'win32'",
]
context = [
    "mcp>=1.0",
    "tree-sitter-language-pack>=0.9",
    "watchfiles>=0.24",
]
preferences = ["jsonschema>=4.22", "Pillow>=10", "PyYAML>=6.0"]
cerebras = ["cerebras_cloud_sdk>=1.0"]
litellm = ["litellm>=1.40"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
heal = [
    "docker>=7.1,<8",
    "PyGithub>=2.5,<3",
    "temporalio>=1.8,<2",
]
all-dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.5",
    "cryptography>=42",
    "keyring>=25",
    "pywin32>=306; sys_platform == 'win32'",
    "mcp>=1.0",
    "tree-sitter-language-pack>=0.9",
    "watchfiles>=0.24",
    "jsonschema>=4.22",
    "Pillow>=10",
    "PyYAML>=6.0",
    "cerebras_cloud_sdk>=1.0",
    "litellm>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "docker>=7.1,<8",
    "PyGithub>=2.5,<3",
    "temporalio>=1.8,<2",
]

[project.scripts]
loopguard = "loopguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopguard = ["demo_projects/**/*", "adapters/templates/*", "router/*.toml", "preferences/*.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
