name: LoopGuard
options:
  bundleIdPrefix: dev.loopguard
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  LoopGuard:
    type: application
    platform: iOS
    sources:
      - path: LoopGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loopguard.ios
        PRODUCT_NAME: LoopGuard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LoopGuard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  LoopGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoopGuardTests
    dependencies:
      - target: LoopGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loopguard.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LoopGuard:
    build:
      targets:
        LoopGuard: all
        LoopGuardTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: LoopGuardTests
      environmentVariables:
        LOOPGUARD_TEST_MODE: "1"
