name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an already verified candidate after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.18.0"

jobs:
  build-portable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: loopguard/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            loopguard/integrations/playwright-loopguard/package-lock.json
      - name: Test and build Python distributions
        run: |
          python -m pip install 'build==1.2.2.post1'
          python -m pip install -e './loopguard[all-dev]'
          python -m pytest -q loopguard/tests
          mkdir -p artifacts/release/files
          python -m build --outdir artifacts/release/files loopguard
      - name: Test and pack Playwright integration
        working-directory: loopguard/integrations/playwright-loopguard
        run: |
          npm ci
          npm test
          npm run build
          npm pack --pack-destination ../../../artifacts/release/files
      - name: Test and build web
        working-directory: apps/web
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build web OCI candidate with BuildKit attestations
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/web
          build-args: BUILD_SHA=${{ github.sha }}
          outputs: type=oci,dest=artifacts/release/files/loopguard-web.oci.tar
          provenance: mode=max
          sbom: true
      - name: Build control API and worker OCI candidates
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: services/control-api/Dockerfile
          build-args: BUILD_SHA=${{ github.sha }}
          outputs: type=oci,dest=artifacts/release/files/loopguard-control-api.oci.tar
          provenance: mode=max
          sbom: true
      - name: Bind worker candidate to the same reviewed runtime
        run: cp artifacts/release/files/loopguard-control-api.oci.tar artifacts/release/files/loopguard-worker.oci.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/release/files

  build-ios-verification:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test unsigned iOS verification archive
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild test \
            -project LoopGuard.xcodeproj \
            -scheme LoopGuard \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "${RUNNER_TEMP}/LoopGuardDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild archive \
            -project LoopGuard.xcodeproj \
            -scheme LoopGuard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LoopGuard.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent \
            build/LoopGuard.xcarchive \
            "${RUNNER_TEMP}/LoopGuard-verification.xcarchive.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/LoopGuard-verification.xcarchive.zip

  sign-and-verify:
    needs: [build-portable, build-ios-verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-release-${{ github.sha }}
          path: artifacts/release/files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-release-${{ github.sha }}
          path: artifacts/release/files
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Inventory immutable outputs
        run: |
          wheel="$(find artifacts/release/files -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find artifacts/release/files -maxdepth 1 -name '*.tar.gz' -print -quit)"
          npm_package="$(find artifacts/release/files -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "${wheel}" -a -n "${sdist}" -a -n "${npm_package}"
          jq -n \
            --arg wheel "${wheel#artifacts/release/}" \
            --arg sdist "${sdist#artifacts/release/}" \
            --arg npm "${npm_package#artifacts/release/}" \
            '{
              schema_version: 1,
              artifacts: [
                {name:"loopguard-wheel",type:"python-wheel",platform:"any",path:$wheel},
                {name:"loopguard-sdist",type:"python-sdist",platform:"source",path:$sdist},
                {name:"loopguard-playwright",type:"npm-package",platform:"node",path:$npm},
                {name:"loopguard-control-api",type:"oci-image",platform:"linux-amd64",path:"files/loopguard-control-api.oci.tar"},
                {name:"loopguard-worker",type:"oci-image",platform:"linux-amd64",path:"files/loopguard-worker.oci.tar"},
                {name:"loopguard-web",type:"web-image",platform:"linux-amd64",path:"files/loopguard-web.oci.tar"},
                {name:"loopguard-ios",type:"ios-verification-archive",platform:"ios",path:"files/LoopGuard-verification.xcarchive.zip"}
              ]
            }' > artifacts/release/inventory.json
      - name: Generate digest-bound SBOM and SLSA predicates
        env:
          BUILDER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          scripts/create_release_candidate.py prepare \
            --root artifacts/release \
            --inventory artifacts/release/inventory.json \
            --commit "${GITHUB_SHA}" \
            --builder "${BUILDER}"
      - name: Keylessly attest every artifact
        run: |
          jq -r '.artifacts[] | [.name,.path] | @tsv' artifacts/release/inventory.json \
            | while IFS=$'\t' read -r name path; do
                cosign attest-blob --yes \
                  --type slsaprovenance1 \
                  --predicate "artifacts/release/evidence/${name}.provenance.json" \
                  --bundle "artifacts/release/evidence/${name}.sigstore.json" \
                  "artifacts/release/${path}"
              done
      - name: Assemble and verify complete release manifest
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          scripts/create_release_candidate.py assemble \
            --root artifacts/release \
            --inventory artifacts/release/inventory.json \
            --commit "${GITHUB_SHA}" \
            --identity "${IDENTITY}" \
            --issuer "${ISSUER}" \
            --output artifacts/release/manifest.json
          scripts/verify_release.sh artifacts/release/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/release

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: sign-and-verify
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release-${{ github.sha }}
          path: artifacts/release
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Reverify before any external write
        run: scripts/verify_release.sh artifacts/release/manifest.json
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve reserved private repositories
        id: registry
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CONTROL_API_REPOSITORY: ${{ vars.ECR_CONTROL_API_REPOSITORY }}
          WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
          WORKER_REPOSITORY: ${{ vars.ECR_WORKER_REPOSITORY }}
        run: |
          set -euo pipefail
          slug='^[a-z0-9][a-z0-9._/-]{1,255}$'
          for repository in "$CONTROL_API_REPOSITORY" "$WEB_REPOSITORY" "$WORKER_REPOSITORY"; do
            [[ "$repository" =~ $slug ]]
          done
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          {
            echo "control=$registry/$CONTROL_API_REPOSITORY"
            echo "web=$registry/$WEB_REPOSITORY"
            echo "worker=$registry/$WORKER_REPOSITORY"
          } >>"$GITHUB_OUTPUT"
      - name: Publish control API and worker from the reviewed source
        id: control
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: services/control-api/Dockerfile
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.registry.outputs.control }}:${{ github.sha }}
            ${{ steps.registry.outputs.worker }}:${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
      - name: Publish web from the reviewed source
        id: web
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/web
          build-args: BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.registry.outputs.web }}:${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
      - name: Sign immutable image references and record them
        env:
          CONTROL_DIGEST: ${{ steps.control.outputs.digest }}
          CONTROL_REPOSITORY: ${{ steps.registry.outputs.control }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WEB_REPOSITORY: ${{ steps.registry.outputs.web }}
          WORKER_REPOSITORY: ${{ steps.registry.outputs.worker }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$CONTROL_REPOSITORY@$CONTROL_DIGEST"
          cosign sign --yes "$WORKER_REPOSITORY@$CONTROL_DIGEST"
          cosign sign --yes "$WEB_REPOSITORY@$WEB_DIGEST"
          jq -n \
            --arg control "$CONTROL_REPOSITORY@$CONTROL_DIGEST" \
            --arg worker "$WORKER_REPOSITORY@$CONTROL_DIGEST" \
            --arg web "$WEB_REPOSITORY@$WEB_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            '{schema_version:1,build_commit:$commit,control_api:$control,worker:$worker,web:$web}' \
            > published-images.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-images-${{ github.sha }}
          if-no-files-found: error
          retention-days: 365
          path: published-images.json
