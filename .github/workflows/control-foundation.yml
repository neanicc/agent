name: control-foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: loopguard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: loopguard/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: loopguard/integrations/browser-broker/package-lock.json
      - name: Install all product and development extras
        run: python -m pip install -e ".[all-dev]"
      - name: Install pinned browser broker runtime
        run: npm ci --prefix integrations/browser-broker
      - name: Ruff
        run: python -m ruff check src tests
      - name: Warning-strict test suite
        run: python -m pytest -q -W error::RuntimeWarning
      - name: Verify generated CLI reference
        run: python -m loopguard.cli_docs --check
      - name: Build distributions
        run: python -m build
