name: control-foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: loopguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: loopguard/pyproject.toml
      - name: Install all product and development extras
        run: python -m pip install -e ".[all-dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Warning-strict test suite
        run: python -m pytest -q -W error::RuntimeWarning
      - name: Verify generated CLI reference
        run: python -m loopguard.cli_docs --check
      - name: Build distributions
        run: python -m build
